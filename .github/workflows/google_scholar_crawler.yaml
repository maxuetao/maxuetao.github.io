name: Get Citation Data

on: 
 workflow_dispatch:
 page_build: 
 schedule:
  - cron:  '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Install Reqs
      run: |
        python -m pip install -r google_scholar_crawler/requirements.txt
        python -m pip check
        python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"
    - name: Run
      run: |
        cd ./google_scholar_crawler
        python3 main.py
        test -s results/gs_data.json
        test -s results/gs_data_shieldsio.json
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
